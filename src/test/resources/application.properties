spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT configuration for tests
jwt.secret=test-secret-key-that-is-at-least-32-bytes-long-for-testing
jwt.expiration-ms=86400000

# WebSocket configuration for tests
websocket.allowed-origins=*

# Gemini configuration for tests (mocked in tests)
gemini.api-key=test-gemini-key
gemini.model=gemini-3.6-flash
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
